name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Remove symlinks and hard links from dist
        run: |
          echo "Removing problematic files from dist..."
          find ./dist -type l -delete || true
          find ./dist -type f -links +1 -exec cp {} {}.tmp \; -exec mv {}.tmp {} \; || true
          echo "Checking remaining files..."
          find ./dist -type l 2>/dev/null | wc -l
          find ./dist -type f -links +1 2>/dev/null | wc -l
          echo "Total size:"
          du -sh ./dist

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
